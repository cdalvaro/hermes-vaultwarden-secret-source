name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  # Pin the Hermes secret-source contract we test against; bump deliberately.
  HERMES_AGENT_REF: v0.22.7

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      - name: Checkout hermes-agent secret-source contract
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_AGENT_REF }}
          sparse-checkout: |
            agent/secret_sources
            hermes_constants.py
            tests/__init__.py
            tests/secret_sources
          sparse-checkout-cone-mode: false
          path: .hermes-agent

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/.hermes-agent
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run --locked pytest tests/
